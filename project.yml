# Source for MailPort.xcodeproj. After adding or removing files, run: xcodegen generate
name: MailPort
options:
  bundleIdPrefix: com.chriswilson.mailport
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
fileGroups:
  - Package.swift
  - project.yml
  - README.md
  - Resources
  - scripts
targets:
  MailPortCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/MailPortCore
  MailPortSecurity:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/MailPortSecurity
  MailPort:
    type: application
    platform: macOS
    sources:
      - path: Sources/MailPortEmbedded
        excludes:
          - Resources
          - "**/.DS_Store"
      - path: Sources/MailPortEmbedded/Resources
        type: group
        buildPhase: resources
    dependencies:
      - target: MailPortCore
      - target: MailPortSecurity
    settings:
      base:
        PRODUCT_NAME: MailPort
        PRODUCT_MODULE_NAME: MailPortEmbedded
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MailPort.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: WDCGJTU726
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Keeps Debug apart in macOS. EmbeddedWorkspace separately refuses the real profile in debug builds.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.chriswilson.mailport.embedded.securityqa
          MAILPORT_DISPLAY_NAME: MailPort Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.chriswilson.mailport.embedded
          MAILPORT_DISPLAY_NAME: MailPort
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    postCompileScripts:
      - name: Generate app icon
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          icon="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MailPort.icns"
          if [ ! -f "$icon" ]; then
            mkdir -p "$TARGET_TEMP_DIR/MailPort.iconset"
            env -i HOME="$HOME" PATH="$PATH" xcrun --sdk macosx swift -module-cache-path "$TARGET_TEMP_DIR/ModuleCache" \
              "$SRCROOT/scripts/make-icon.swift" "$TARGET_TEMP_DIR/MailPort.iconset" "$icon"
          fi
  MailPortCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MailPortCoreTests
    dependencies:
      - target: MailPortCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MailPortSecurityTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MailPortSecurityTests
    dependencies:
      - target: MailPortSecurity
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MailPortEmbeddedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MailPortEmbeddedTests
    dependencies:
      - target: MailPort
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: WDCGJTU726
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MailPort.app/Contents/MacOS/MailPort"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MailPort:
    build:
      targets:
        MailPort: all
        MailPortCoreTests: [test]
        MailPortSecurityTests: [test]
        MailPortEmbeddedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MailPortCoreTests
        - MailPortSecurityTests
        - MailPortEmbeddedTests
    archive:
      config: Release
