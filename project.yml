# Source for MailPort.xcodeproj. After adding or removing files, run: xcodegen generate
name: MailPort
options:
  bundleIdPrefix: com.chriswilson.mailport
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    visionOS: "1.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
fileGroups:
  - Package.swift
  - project.yml
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - Resources
  - scripts
targets:
  MailPortCore:
    type: library.static
    platform: auto
    supportedDestinations: [macOS, iOS, visionOS]
    sources:
      - path: Sources/MailPortCore
  MailPortSecurity:
    type: library.static
    platform: auto
    supportedDestinations: [macOS, iOS, visionOS]
    sources:
      - path: Sources/MailPortSecurity
  MailPort:
    type: application
    platform: macOS
    sources:
      - path: Sources/MailPortEmbedded
        excludes:
          - Resources
          - "**/.DS_Store"
      - path: Sources/MailPortEmbedded/Resources
        type: group
        buildPhase: resources
    dependencies:
      - target: MailPortCore
      - target: MailPortSecurity
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: MailPort
        PRODUCT_MODULE_NAME: MailPortEmbedded
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MailPort.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: WDCGJTU726
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Keeps Debug apart in macOS. EmbeddedWorkspace separately refuses the real profile in debug builds.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.chriswilson.mailport.embedded.securityqa
          MAILPORT_DISPLAY_NAME: MailPort Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.chriswilson.mailport.embedded
          MAILPORT_DISPLAY_NAME: MailPort
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    postCompileScripts:
      - name: Generate app icon
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          icon="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MailPort.icns"
          if [ ! -f "$icon" ]; then
            mkdir -p "$TARGET_TEMP_DIR/MailPort.iconset"
            env -i HOME="$HOME" PATH="$PATH" xcrun --sdk macosx swift -module-cache-path "$TARGET_TEMP_DIR/ModuleCache" \
              "$SRCROOT/scripts/make-icon.swift" "$TARGET_TEMP_DIR/MailPort.iconset" "$icon"
          fi
  # iPhone, iPad, and Vision Pro. Shares MailPortCore and MailPortSecurity with the Mac app.
  MailPortMobile:
    type: application
    platform: auto
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: Sources/MailPortMobile
    dependencies:
      - target: MailPortCore
      - target: MailPortSecurity
    settings:
      base:
        PRODUCT_NAME: MailPort
        PRODUCT_MODULE_NAME: MailPortMobile
        TARGETED_DEVICE_FAMILY: "1,2,7"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(MAILPORT_DISPLAY_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: Google Meet and Chat use the camera for video calls.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Google Meet and Chat use the microphone for calls.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: WDCGJTU726
      configs:
        # Separate bundle identifiers give Debug its own sandbox, so it never touches real accounts.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.chriswilson.mailport.mobile.dev
          MAILPORT_DISPLAY_NAME: MailPort Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.chriswilson.mailport.mobile
          MAILPORT_DISPLAY_NAME: MailPort
  MailPortCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MailPortCoreTests
    dependencies:
      - target: MailPortCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MailPortSecurityTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MailPortSecurityTests
    dependencies:
      - target: MailPortSecurity
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MailPortEmbeddedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MailPortEmbeddedTests
    dependencies:
      - target: MailPort
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: WDCGJTU726
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MailPort.app/Contents/MacOS/MailPort"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MailPort:
    build:
      targets:
        MailPort: all
        MailPortCoreTests: [test]
        MailPortSecurityTests: [test]
        MailPortEmbeddedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MailPortCoreTests
        - MailPortSecurityTests
        - MailPortEmbeddedTests
    archive:
      config: Release
  MailPortMobile:
    build:
      targets:
        MailPortMobile: all
    run:
      config: Debug
    archive:
      config: Release
